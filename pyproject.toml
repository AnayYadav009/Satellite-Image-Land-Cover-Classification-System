[project]
name = "landcover-segmentation"
version = "0.1.0"
description = "Multispectral land-cover semantic segmentation using Sentinel-2 and UNet"
authors = [{ name = "Anay Yadav" }]
urls = { Repository = "https://github.com/AnayYadav009/Satellite-Image-Land-Cover-Classification-System" }
dependencies = [
    "numpy",
    "pandas",
    "rasterio",
    "geopandas",
    "torch",
    "torchvision",
    "pytorch-lightning",
    "segmentation-models-pytorch",
    "albumentations",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "earthengine-api",
    "geemap",
    "scikit-image",
    "scipy",
    "opencv-python",
    "streamlit",
    "Pillow",
    "torchmetrics",
    "folium",
    "streamlit-folium",
    "transformers",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100

[tool.pyright]
include = ["src", "run_pipeline.py", "app.py"]
extraPaths = [".", "src"]
executionEnvironments = [
    { root = "." }
]
